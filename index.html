<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        form {
            width: 300px;
            margin: 80px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }

        input, button {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="form">
        <h2>Event Registration</h2>

        <form>
            <input type="text" placeholder="Name" required>

            <input type="email" placeholder="Email" required>

            <input type="tel" placeholder="Phone Number" required>

            <button type="submit">Register</button>
<button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
